name: Native strategy migration status
on:
  push:
    branches: [main]
    paths: ['paper/**', '.github/workflows/market.yml']
  workflow_dispatch:
  schedule:
    - cron: '35 8 * * 1-5'
    - cron: '50 8 1 * *'
    - cron: '50 8 * * 1'
permissions:
  contents: read
concurrency:
  group: real-market-report
  cancel-in-progress: false
jobs:
  status:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record native migration status
        run: |
          echo 'Native migration in progress. Legacy selection, price rules, and legacy feedback email are retired. Native training and PA validation must pass before recommendations resume.' >> "$GITHUB_STEP_SUMMARY"
