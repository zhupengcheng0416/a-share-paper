name: Free real A-share analysis and email
on:
  push:
    branches: [main]
    paths: ['paper/**', 'cloudflare/market-data.mjs', '.github/workflows/market.yml']
  workflow_dispatch:
  schedule:
    - cron: '35 8 * * 1-5'
    - cron: '50 8 1 * *'
    - cron: '50 8 * * 1'
permissions:
  contents: write
  id-token: write
concurrency:
  group: real-market-report
  cancel-in-progress: false
jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only research dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 'pandas>=2.2,<3' scipy==1.18.1 pyarrow==25.0.1 jsonschema==4.26.0
      - name: Acquire real data through short-lived GitHub OIDC
        run: python -m paper.market --output state/real-market-report.json --details 20
      - name: Render report
        run: python -m paper.report --input state/real-market-report.json
      - name: Deliver fixed-recipient email
        env:
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m paper.report --input state/real-market-report.json --send
      - name: Archive frozen plans actually sent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m paper.feedback --archive-report state/real-market-report.json
      - name: Weekly monthly and quarterly feedback email
        if: ${{ !cancelled() }}
        env:
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m paper.feedback --send
      - name: Publish safe execution summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          lines=['## A股真实数据分析（只研究，不下单）']
          p=Path('state/real-market-report.json')
          if p.exists():
              r=json.loads(p.read_text());lines += ['交易日：'+r['session'], '覆盖：'+json.dumps(r['coverage'],ensure_ascii=False)]
          p=Path('state/mail-status.json')
          if p.exists():lines += ['邮件：'+p.read_text()]
          p=Path('state/feedback-status.json')
          if p.exists():lines += ['周度/月度/季度反馈：'+p.read_text()]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write('\n\n'.join(lines))
          PY
