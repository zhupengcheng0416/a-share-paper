name: Free A-share research verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-verification
  cancel-in-progress: false
jobs:
  verify:
    # Standard runner on a public repository only. No paid runners or API clients.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 'pandas>=2.2,<3' scipy==1.18.1 pyarrow==25.0.1 jsonschema==4.26.0
      - name: Verify pinned integrations and simulation gates
        run: |
          python -m unittest discover -s tests -v
          node tests/test_worker.mjs
          node tests/test_market_worker.mjs
          python -m paper.service check
      - name: State tested scope
        run: |
          echo 'Three upstream engines tested on synthetic fixtures; no market scan, no broker orders, no paid model calls.' >> "$GITHUB_STEP_SUMMARY"
